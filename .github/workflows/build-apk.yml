name: Build Android APK & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Standalone Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🚀 Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 🔨 Build Android APK via EAS
        if: env.EXPO_TOKEN != ''
        run: eas build --platform android --profile preview --non-interactive

      - name: 📝 Upload Release Artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: NearBin Release ${{ github.ref_name }}
          body: |
            ## 🌱 NearBin - Smart Public Waste Heatmap & Reporting APK
            
            ### ✨ What's New:
            - **Google Sign-In & Mobile OTP Verification Gate**
            - **Instant Server-Side Profile Synchronization**
            - **Mappls Leaflet Street Map with Snapchat-Style Glowing Heatmaps**
            - **One-Tap GPS Recenter Accuracy Target Button (`🎯`)**
            - **Multi-Category Waste Reporting (Plastic, Scrap, Wet Waste, Debris)**
            - **Live Uncropped Camera Capture with GPS Watermark**
            - **Govt Safai Mitra & Kabadiwala Recycler Portals**
            - **Light & Dark Theme Toggle (OLED & Daylight modes)**
            
            Download and install `NearBin.apk` below on any Android phone!
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
