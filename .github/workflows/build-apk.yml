name: Build Android APK & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Standalone Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install dependencies
        run: npm install --legacy-peer-deps

      - name: 🔨 Generate Native Android Project
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_PUBLIC_API_URL: https://nearbin-api.onrender.com/api

      - name: ⚙️ Build Standalone APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon || ./gradlew assembleDebug --no-daemon
        env:
          EXPO_PUBLIC_API_URL: https://nearbin-api.onrender.com/api

      - name: 📦 Locate and Package APK
        run: |
          mkdir -p release
          APK_FILE=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -f "$APK_FILE" ]; then
            cp "$APK_FILE" release/NearBin.apk
            echo "Successfully generated release/NearBin.apk"
            ls -lh release/NearBin.apk
          else
            echo "Error: APK file not found!"
            exit 1
          fi

      - name: 📝 Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: NearBin Release ${{ github.ref_name }}
          files: release/NearBin.apk
          body: |
            ## 🌱 NearBin - Smart Public Waste Heatmap & Reporting APK (${{ github.ref_name }})
            
            Official civic waste management and reporting app created by **Earth Relief India** (Founder: Keshav Singh).
            
            ### ✨ Included Features:
            - **Google Sign-In & Mobile OTP Verification**
            - **Instant Server-Side Profile Synchronization**
            - **Live Camera GPS Watermarking (uncropped photos with auto geo-tagging)**
            - **Snapchat-Style Garbage Density Heatmap (Mappls & Carto tiles)**
            - **One-Tap High Accuracy GPS Recenter Target (`🎯`)**
            - **Multi-Category Waste Selection (Plastic, Scrap, Food/Organic, Debris)**
            - **Govt Safai Mitra & Kabadiwala Recycler Portals**
            - **OLED Dark Theme & High-Contrast Daylight Mode**
            - **Connected to 24/7 Production Cloud Server**: `https://nearbin-api.onrender.com/api`
            
            ### 📱 Download & Installation:
            1. Download `NearBin.apk` below.
            2. On Android, tap the APK and select **"Allow from this source"** if prompted.
            3. Open NearBin and start reporting!
            
            Website: [https://earthrelief.in/nearbin](https://earthrelief.in/nearbin)
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
